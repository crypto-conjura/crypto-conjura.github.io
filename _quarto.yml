project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
  resources:
    - "conjura.json"

website:
  title: "Conjura"
  description: "An open archive of unresolved conjectures in cryptography, precise write-ups, and reusable research prompts."
  # site-url is what makes Quarto emit sitemap.xml, canonical <link> tags, and
  # absolute URLs in the Open Graph and Twitter card metadata. Without it there
  # is no sitemap at all, and a shared link previews with no title or
  # description. It has to be the deployed origin, not a relative path.
  site-url: "https://crypto-conjura.github.io"
  repo-url: "https://github.com/crypto-conjura/crypto-conjura.github.io"
  open-graph: true
  twitter-card: true
  bread-crumbs: false
  # The navbar's left-hand entries mirror the sidebar's top-level sections
  # below, in the same order. Whenever a top-level sidebar section is
  # added, renamed, or removed, update this list to match -- and vice
  # versa. (Blog was dropped from both on 2026-08-16 because no posts
  # existed yet, and restored to both later the same day once the first
  # one did.)
  navbar:
    title: "Conjura"
    left:
      - text: "Open Problems"
        file: open-problems/index.qmd
      - text: "Papers"
        file: papers/index.qmd
      - text: "Surveys"
        file: surveys/index.qmd
      - text: "Resources"
        file: resources/index.qmd
      - text: "Blog"
        file: blog/index.qmd
      - text: "About"
        file: about/index.qmd
    right:
      - icon: github
        href: "https://github.com/crypto-conjura/crypto-conjura.github.io"

  # One line on every page. The site is AI-generated and unreviewed, and a
  # site that grades provenance per artifact has to say so about itself. The
  # full statement is on the About page; this is a pointer, not a banner.
  page-footer:
    center: |
      This site is AI-generated and has not been independently reviewed.
      [What that means](/about/index.qmd#this-site-has-not-been-reviewed-either)

  # Top-level sections here (Open Problems, Papers, Surveys, Resources,
  # Blog, About) are mirrored in the navbar's LEFT list above, in the same
  # order. Keep the two in sync -- see the comment there. navbar.right holds
  # only the GitHub icon: an entry parked there still looks mirrored on a
  # rendered page, because the two lists concatenate, while breaking this
  # rule.
  #
  # ONE level of nesting only. A section holds links, never another section.
  # Anything with children of its own is a link to a page that lists them:
  # the 19 areas are on open-problems/, the 9 UC layers are on uc/, the
  # papers are on papers/archive/. A sidebar that unfolds two levels deep is
  # a navigation tree competing with the pages, and the pages win.
  # The UC Encyclopedia is still filed under Surveys; only its nesting went,
  # and its URLs stay at /uc/... regardless.
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - section: "Open Problems"
        href: open-problems/index.qmd
        contents:
          - open-problems/all/index.qmd
          - open-problems/status-legend/index.qmd
      - section: "Papers"
        href: papers/index.qmd
        contents:
          # Archive is a page listing the papers, deliberately not an
          # expandable section: clicking it should go somewhere, not unfold a
          # list in place. New papers are added to that page rather than here.
          # Example Paper is absent on purpose; it is the frontmatter contract
          # a new paper is copied from, and stays reachable from papers/,
          # README.md and the Programme Committee page.
          - papers/archive/index.qmd
          - papers/programme-committee/index.qmd
          - papers/proposals/index.qmd
      - section: "Surveys"
        href: surveys/index.qmd
        contents:
          - surveys/uc-for-gamers/index.qmd
          - uc/index.qmd
      - section: "Resources"
        href: resources/index.qmd
        contents:
          - open-problems/latex-templates/index.qmd
          - prompts/index.qmd
      - section: "Blog"
        href: blog/index.qmd
        contents:
          # `auto:` is what expands a glob here. A bare "blog/posts/*.qmd"
          # is taken as a literal entry and renders as dead text.
          - auto: "blog/posts/*.qmd"
      - section: "About"
        href: about/index.qmd

format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    # Emits <link rel="canonical"> on every page, and with it the absolute
    # og:url. This is a format option rather than a `website:` one, but it
    # only does anything once `website: site-url:` is set above.
    canonical-url: true
    toc: true
    grid:
      sidebar-width: 260px
      body-width: 850px
