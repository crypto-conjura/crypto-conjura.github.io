project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"

website:
  title: "Crypto-Conjura"
  description: "An open archive of unresolved conjectures in cryptography, precise write-ups, and reusable research prompts."
  bread-crumbs: false
  navbar:
    title: "Crypto-Conjura"
    left:
      - text: "Open Problems"
        file: open-problems/index.qmd
      - text: "Papers"
        file: papers/index.qmd
      - text: "Prompts"
        file: prompts/index.qmd
      - text: "Blog"
        file: blog/index.qmd
    right:
      - icon: github
        href: "https://github.com/crypto-conjura/crypto-conjura.github.io"

  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - section: "Open Problems"
        href: open-problems/index.qmd
        contents:
          - section: "Blockchain & Distributed Consensus"
            href: open-problems/consensus/index.qmd
          - section: "Foundations of Cryptography"
            href: open-problems/foundations/index.qmd
          - section: "Homomorphic & Functional Encryption"
            href: open-problems/homomorphic-encryption/index.qmd
          - section: "Idealized Models"
            href: open-problems/idealized-models/index.qmd
          - section: "Impossibility Results"
            href: open-problems/impossibility-results/index.qmd
          - section: "Information-Theoretic Cryptography"
            href: open-problems/information-theoretic/index.qmd
          - section: "Isogenies"
            href: open-problems/isogenies/index.qmd
          - section: "Lattices"
            href: open-problems/lattices/index.qmd
          - section: "Multi-Party Computation"
            href: open-problems/mpc/index.qmd
          - section: "Obfuscation & Functional Encryption"
            href: open-problems/obfuscation/index.qmd
          - section: "Privacy-Enhancing Technologies"
            href: open-problems/privacy/index.qmd
          - section: "Proof Systems & Succinct Arguments"
            href: open-problems/proof-systems/index.qmd
          - section: "Public-Key Cryptography"
            href: open-problems/public-key/index.qmd
          - section: "Quantum Cryptography"
            href: open-problems/quantum/index.qmd
          - section: "Secret Sharing & Threshold Cryptography"
            href: open-problems/secret-sharing/index.qmd
          - section: "Side-Channel & Implementation Security"
            href: open-problems/side-channel/index.qmd
          - section: "Symmetric-Key Cryptography"
            href: open-problems/symmetric-key/index.qmd
          - section: "Universal Composability"
            href: open-problems/universal-composability/index.qmd
          - section: "Zero-Knowledge"
            href: open-problems/zk/index.qmd
      - section: "Papers"
        href: papers/index.qmd
        contents:
          - papers/example-paper/index.qmd
      - section: "Prompts"
        href: prompts/index.qmd
        contents:
          - prompts/research/index.qmd
          - prompts/proof-checking/index.qmd
          - prompts/writing/index.qmd

format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    toc: true
    grid:
      sidebar-width: 260px
      body-width: 850px
