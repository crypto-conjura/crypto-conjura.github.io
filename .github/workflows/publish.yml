name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # c/ holds the statements, papers/ holds the papers; both carry the same
      # status:/statement_sha/status_badge contract, so both are gated. Hubs
      # under p/ carry no badge (see /schema/) and are deliberately not scanned.
      - name: Validate statement schema and badges
        run: python3 scripts/status_badge.py --check c papers

      - name: Build facet index (conjura.json, _generated/)
        run: python3 scripts/build_index.py

      - name: Check relation graph consistency
        run: python3 scripts/check_relations.py

      # Every topic page, the tag-cloud overview, and each statement's own
      # chip row are all generated from topics: frontmatter -- this fails
      # when any of them is stale relative to that.
      - name: Check topic tag pages are current
        run: python3 scripts/gen_topics.py --check

      # Every UC functionality box on the site is generated from the .tex
      # fragment the book itself \input's. This fails the build when a page
      # is not what its fragment produces -- most often because a line was
      # added to the LaTeX and the page's hardcoded <ol start="N"> went stale.
      - name: Check UC interface boxes against their LaTeX
        run: python3 scripts/gen_interface.py --check

      # Every statement page carries the same five tabs in the same order,
      # taken from c/0020. Three layouts had grown up before this gate, so a
      # reader found Open obligations inside the tabs on one page and loose
      # below them on the next.
      - name: Check statement pages share one tab layout
        run: python3 scripts/tab_structure.py --check

      # Fails when a committed PDF or HTML edition no longer matches the
      # LaTeX it was built from, in either direction. It never builds:
      # this runner has no TeX, and build_uc_html.sh wants macOS TeX Live,
      # make4ht and TeX Live's own dvisvgm. Rebuilding is a human's job on
      # a machine that can; this only reports that it is owed.
      - name: Artifacts match their LaTeX source
        run: python3 scripts/artifact_manifest.py --check

      - name: Check each UC entry says whether it has a definition
        run: python3 scripts/uc_status.py --check

      # Reports drafts in latex/conjectures/ that never became a page in c/,
      # and fails only on a `draft:` link that contradicts the tree. An
      # unpromoted draft is normal editorial backlog, not a broken build, and
      # this step runs before the render -- failing on one would stop the site
      # deploying for everyone until somebody promoted it.
      - name: Report conjecture drafts with no site page
        run: python3 scripts/draft_status.py --check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Render site
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
