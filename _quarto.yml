project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
  # Runs after every render, including in CI. Quarto's HTML template
  # injects a third-party polyfill script next to MathJax that no
  # supported option turns off; this strips it. The script explains why
  # removing it beats vendoring it.
  post-render:
    - python3 scripts/strip_polyfill.py

  resources:
    - "conjura.json"
    # The HTML edition of UC for Gamers, generated from the same LaTeX as the
    # PDF by scripts/build_uc_html.sh. Not a .qmd, so Quarto only ships it if
    # it is listed here.
    - "surveys/uc-for-gamers/html/**"
    # MathJax, vendored rather than fetched from a CDN. See html-math-method
    # below; scripts/build_uc_html.sh points the UC edition at the same copy,
    # so the site loads one MathJax, once, from its own origin.
    - "assets/mathjax/**"
    - CNAME
    
website:
  title: "Conjura"
  description: "An open archive of unresolved conjectures in cryptography, precise write-ups, and reusable research prompts."
  # site-url is what makes Quarto emit sitemap.xml, canonical <link> tags, and
  # absolute URLs in the Open Graph and Twitter card metadata. Without it there
  # is no sitemap at all, and a shared link previews with no title or
  # description. It has to be the deployed origin, not a relative path.
  site-url: "https://conjura.org"
  repo-url: "https://github.com/crypto-conjura/crypto-conjura.github.io"
  # The tab mark: a ring with a disc inside it, the same shape as the status
  # badge on every statement page, fixed at the accent colour so it reads as
  # the site rather than as a grade. SVG so it stays crisp at every size and
  # can answer prefers-color-scheme; assets/favicon-32.png and
  # assets/apple-touch-icon.png are rendered from that one file for the
  # browsers and home screens that will not take an SVG, and are linked
  # below under format.html.include-in-header.
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  bread-crumbs: false
  # The navbar's left-hand entries mirror the sidebar's top-level sections
  # below, in the same order. Whenever a top-level sidebar section is
  # added, renamed, or removed, update this list to match -- and vice
  # versa. (Blog was dropped from both on 2026-08-16 because no posts
  # existed yet, and restored to both later the same day once the first
  # one did.)
  navbar:
    title: "Conjura"
    left:
      - text: "Problems"
        file: open-problems/index.qmd
      - text: "Papers"
        file: papers/index.qmd
      - text: "Surveys"
        file: surveys/index.qmd
      - text: "Resources"
        file: resources/index.qmd
      - text: "Philosophy"
        file: about/index.qmd
      - text: "Support"
        file: support/index.qmd
    right:
      - icon: github
        href: "https://github.com/crypto-conjura/crypto-conjura.github.io"

  # One line on every page. The site is AI-generated and unreviewed, and a
  # site that grades provenance per artifact has to say so about itself. The
  # full statement is on the Philosophy page; this is a pointer, not a banner.
  page-footer:
    center: |
      This site is AI-generated and has not been independently reviewed.
      [What that means](/about/index.qmd#this-site-has-not-been-reviewed-either)

  # NAVIGATION, in two halves, and the split is the design.
  #
  # The navbar above carries the main sections and nothing else. The sidebar
  # carries only what is *inside* the section you are in -- it never repeats
  # the section names, because they are already at the top of every page and
  # a reader does not need the same six words twice.
  #
  # That contextual behaviour is why this is a LIST of sidebars rather than
  # one. Quarto matches a page to the sidebar whose contents contain it, so
  # each section gets its own, and a page in no sidebar simply gets none --
  # which is the right answer for a statement or a functionality page, where
  # the page's own content is the navigation.
  #
  # Each sidebar's `id` is its section. Keep the set in step with the
  # navbar's left list above: a section added there wants a sidebar here if
  # it has children, and Philosophy and Support deliberately have none.
  #
  # ONE level of nesting only. A sidebar holds links, never sections.
  # Anything with children of its own is a link to a page that lists them:
  # the 19 areas are on open-problems/, the 9 UC layers are on uc/, the
  # papers are on papers/archive/. A sidebar that unfolds two levels deep is
  # a navigation tree competing with the pages, and the pages win.
  #
  # Blog stays out of both lists for now, by request. The pages are still
  # built and still resolve, so nothing pointing at /blog/ breaks; they are
  # simply not advertised. Restoring it means a navbar entry above and, if it
  # gains children, a sidebar here -- and note that `auto:` is what expands a
  # glob in contents, since a bare "blog/posts/*.qmd" is taken as a literal
  # entry and renders as dead text.
  sidebar:
    - id: problems
      style: floating
      collapse-level: 1
      contents:
        # The section's own landing page, named "Overview" rather than
        # repeating the section name the navbar already shows. It has to be
        # listed for Quarto to match that page to this sidebar at all.
        - text: "Overview"
          href: open-problems/index.qmd
        - open-problems/all/index.qmd
        - open-problems/status-legend/index.qmd
    - id: papers
      style: floating
      collapse-level: 1
      contents:
        # Archive is a page listing the papers, deliberately not an
        # expandable section: clicking it should go somewhere, not unfold a
        # list in place. New papers are added to that page rather than here.
        # Example Paper is absent on purpose; it is the frontmatter contract
        # a new paper is copied from, and stays reachable from papers/,
        # README.md and the Reviews page.
        # The section's own landing page, named "Overview" rather than
        # repeating the section name the navbar already shows. It has to be
        # listed for Quarto to match that page to this sidebar at all.
        - text: "Overview"
          href: papers/index.qmd
        - papers/archive/index.qmd
        - papers/reviews/index.qmd
        - papers/proposals/index.qmd
    - id: surveys
      style: floating
      collapse-level: 1
      contents:
        # The UC Encyclopedia is still filed under Surveys; its URLs stay at
        # /uc/... regardless.
        # The section's own landing page, named "Overview" rather than
        # repeating the section name the navbar already shows. It has to be
        # listed for Quarto to match that page to this sidebar at all.
        - text: "Overview"
          href: surveys/index.qmd
        - surveys/uc-for-gamers/index.qmd
        - uc/index.qmd
        - uc/all/index.qmd
    - id: resources
      style: floating
      collapse-level: 1
      contents:
        # The section's own landing page, named "Overview" rather than
        # repeating the section name the navbar already shows. It has to be
        # listed for Quarto to match that page to this sidebar at all.
        - text: "Overview"
          href: resources/index.qmd
        - open-problems/latex-templates/index.qmd
        - prompts/index.qmd

format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    # Emits <link rel="canonical"> on every page, and with it the absolute
    # og:url. This is a format option rather than a `website:` one, but it
    # only does anything once `website: site-url:` is set above.
    canonical-url: true
    # Quarto emits one <link rel="icon"> from `favicon` above. These are the
    # two it does not: a PNG for anything that cannot render an SVG icon, and
    # the touch icon iOS uses when a reader adds the site to a home screen.
    # Both are generated from assets/favicon.svg, so the mark has one source.
    include-in-header:
      - text: |
          <link rel="alternate icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
          <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    # Self-hosted MathJax. Quarto's default is
    # cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js, which made every page on
    # the site depend on a third party to render any mathematics, and ran a
    # different major version from the UC edition's own copy. This is
    # mathjax@3.2.2 tex-chtml-full: "full" because the UC edition needs the
    # TeX extensions, and 3.x because that is what its 78 injected macros and
    # 5,886 formulas are verified against. The fonts sit beside it at
    # assets/mathjax/output/chtml/fonts/woff-v2/, which is where the script
    # looks for them, relative to its own URL.
    html-math-method:
      method: mathjax
      url: "/assets/mathjax/tex-chtml-full.js"
    toc: true
    grid:
      sidebar-width: 260px
      body-width: 850px
