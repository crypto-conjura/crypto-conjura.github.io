project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
  resources:
    - "conjura.json"

website:
  title: "Conjura"
  description: "An open archive of unresolved conjectures in cryptography, precise write-ups, and reusable research prompts."
  bread-crumbs: false
  navbar:
    title: "Conjura"
    left:
      - text: "Open Problems"
        file: open-problems/index.qmd
      - text: "Papers"
        file: papers/index.qmd
      - text: "Prompts"
        file: prompts/index.qmd
      - text: "Blog"
        file: blog/index.qmd
    right:
      - text: "UC Encyclopedia"
        file: uc/index.qmd
      - icon: github
        href: "https://github.com/crypto-conjura/crypto-conjura.github.io"

  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - section: "Open Problems"
        href: open-problems/index.qmd
        contents:
          - open-problems/all/index.qmd
          - section: "By area"
            contents:
              - open-problems/areas/foundations/index.qmd
              - open-problems/areas/idealized-models/index.qmd
              - open-problems/areas/impossibility-results/index.qmd
              - open-problems/areas/symmetric-key/index.qmd
              - open-problems/areas/information-theoretic/index.qmd
              - open-problems/areas/side-channel/index.qmd
              - open-problems/areas/public-key/index.qmd
              - open-problems/areas/lattices/index.qmd
              - open-problems/areas/isogenies/index.qmd
              - open-problems/areas/quantum/index.qmd
              - open-problems/areas/zk/index.qmd
              - open-problems/areas/proof-systems/index.qmd
              - open-problems/areas/homomorphic-encryption/index.qmd
              - open-problems/areas/obfuscation/index.qmd
              - open-problems/areas/mpc/index.qmd
              - open-problems/areas/secret-sharing/index.qmd
              - open-problems/areas/universal-composability/index.qmd
              - open-problems/areas/privacy/index.qmd
              - open-problems/areas/consensus/index.qmd
          - open-problems/status-legend/index.qmd
          - open-problems/latex-templates/index.qmd
      - papers/index.qmd
      - section: "Prompts"
        href: prompts/index.qmd
        contents:
          - prompts/research/index.qmd
          - prompts/proof-checking/index.qmd
          - prompts/writing/index.qmd
      - section: "UC Encyclopedia"
        href: uc/index.qmd
        contents:
          - uc/layer-0-idealized-setup/index.qmd
          - uc/layer-1-channels-agreement-ledgers/index.qmd
          - uc/layer-2-crypto-library-symmetric/index.qmd
          - uc/layer-3-public-key-primitives/index.qmd
          - uc/layer-4-commitments-proofs/index.qmd
          - uc/layer-5-oblivious-transfer/index.qmd
          - uc/layer-6-secret-sharing-mpc/index.qmd
          - uc/layer-7-privacy-anonymity/index.qmd
          - uc/layer-8-time-application/index.qmd

format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    toc: true
    grid:
      sidebar-width: 260px
      body-width: 850px
