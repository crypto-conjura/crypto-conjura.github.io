<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Conjura">
  <!--
    The site's own mark, and deliberately the same shape as the status badge
    that sits on every statement page: a ring with a disc inside it. The badge
    varies its ring and disc to grade a statement's provenance; this one is
    fixed at the accent colour, so a reader who has seen a badge recognises
    the tab, and nobody reads a grade into it.

    No text. A letterform in a 16px favicon depends on whichever serif the
    machine happens to have, and Baskerville is not one a browser can be
    asked for here -- the geometry survives scaling and the letter would not.

    Theme-aware: browsers that support SVG favicons (Chrome, Firefox, Safari
    16+) honour prefers-color-scheme inside the file, so the mark uses the
    light accent on a light tab strip and the dark accent on a dark one. Where
    it is unsupported, the light values apply, which is the fallback anyone
    would pick anyway.
  -->
  <style>
    .ground { fill: #faf9f5; }
    .ring   { stroke: #a34f2a; }
    .disc   { fill: #a34f2a; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #1f1e1d; }
      .ring   { stroke: #e89b7f; }
      .disc   { fill: #e89b7f; }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="7"/>
  <circle class="ring" cx="16" cy="16" r="10.5" fill="none" stroke-width="3.5"/>
  <circle class="disc" cx="16" cy="16" r="4.5"/>
</svg>
