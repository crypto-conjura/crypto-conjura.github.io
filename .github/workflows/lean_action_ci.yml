name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      # leanprover-community/docgen-action@v1 deliberately left out here: at
      # the exact `v1` ref this repo would pin to, its "Deploy to GitHub
      # Pages" step runs unconditionally on every push with no opt-out input
      # (later branches added a `deploy` toggle, but `v1` itself has none).
      # This repo's Pages site is already deployed by
      # .github/workflows/publish.yml (the Quarto build); adding docgen-action
      # as-is would make every push race that deployment and can overwrite the
      # live site with Lean API docs. Re-add it only once Lean docs have a
      # deliberate home (e.g. a subpath the Quarto build copies in, or a newer
      # pinned version/SHA with a real deploy toggle) rather than the whole
      # Pages site.
      #
      # The "deliberate home" now exists -- c/<id>/lean/html/, generated by
      # scripts/build_lean_html.py and copied in by the Quarto build -- but it
      # is a syntax-highlighted reading copy of the sources, not doc-gen4
      # output, and docgen-action is still not wired in here. The reason is now
      # cost as well as the deploy toggle: `lake build <lib>:docs` needs the
      # docs facet of every transitive import, and c/0004's five Mathlib
      # imports pull in ~8,300 Mathlib modules, so documenting 767 lines would
      # mean building the whole of Mathlib's documentation on every push.
