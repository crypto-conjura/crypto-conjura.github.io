project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
  resources:
    - "conjura.json"

website:
  title: "Conjura"
  description: "An open archive of unresolved conjectures in cryptography, precise write-ups, and reusable research prompts."
  # site-url is what makes Quarto emit sitemap.xml, canonical <link> tags, and
  # absolute URLs in the Open Graph and Twitter card metadata. Without it there
  # is no sitemap at all, and a shared link previews with no title or
  # description. It has to be the deployed origin, not a relative path.
  site-url: "https://crypto-conjura.github.io"
  repo-url: "https://github.com/crypto-conjura/crypto-conjura.github.io"
  open-graph: true
  twitter-card: true
  bread-crumbs: false
  # The navbar's left-hand entries mirror the sidebar's top-level sections
  # below, in the same order. Whenever a top-level sidebar section is
  # added, renamed, or removed, update this list to match -- and vice
  # versa. (Blog was dropped from both on 2026-08-16 because no posts
  # existed yet, and restored to both later the same day once the first
  # one did.)
  navbar:
    title: "Conjura"
    left:
      - text: "Open Problems"
        file: open-problems/index.qmd
      - text: "Papers"
        file: papers/index.qmd
      - text: "Surveys"
        file: surveys/index.qmd
      - text: "Resources"
        file: resources/index.qmd
      - text: "Blog"
        file: blog/index.qmd
      - text: "About"
        file: about/index.qmd
    right:
      - icon: github
        href: "https://github.com/crypto-conjura/crypto-conjura.github.io"

  # Top-level sections here (Open Problems, Papers, Surveys, Resources,
  # Blog, About) are mirrored in the navbar's LEFT list above, in the same
  # order. Keep the two in sync -- see the comment there. navbar.right holds
  # only the GitHub icon: an entry parked there still looks mirrored on a
  # rendered page, because the two lists concatenate, while breaking this
  # rule. The UC Encyclopedia is a subsection of Surveys rather than a
  # top-level section, so the rule does not reach it; its URLs stay at
  # /uc/... either way.
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - section: "Open Problems"
        href: open-problems/index.qmd
        contents:
          - open-problems/all/index.qmd
          - section: "By area"
            contents:
              - open-problems/areas/foundations/index.qmd
              - open-problems/areas/idealized-models/index.qmd
              - open-problems/areas/impossibility-results/index.qmd
              - open-problems/areas/symmetric-key/index.qmd
              - open-problems/areas/information-theoretic/index.qmd
              - open-problems/areas/side-channel/index.qmd
              - open-problems/areas/public-key/index.qmd
              - open-problems/areas/lattices/index.qmd
              - open-problems/areas/isogenies/index.qmd
              - open-problems/areas/quantum/index.qmd
              - open-problems/areas/zk/index.qmd
              - open-problems/areas/proof-systems/index.qmd
              - open-problems/areas/homomorphic-encryption/index.qmd
              - open-problems/areas/obfuscation/index.qmd
              - open-problems/areas/mpc/index.qmd
              - open-problems/areas/secret-sharing/index.qmd
              - open-problems/areas/universal-composability/index.qmd
              - open-problems/areas/privacy/index.qmd
              - open-problems/areas/consensus/index.qmd
          - open-problems/status-legend/index.qmd
      - section: "Papers"
        href: papers/index.qmd
        contents:
          # Every paper goes under Archive, not directly here. Example Paper is
          # deliberately absent: it is the frontmatter contract new papers are
          # copied from, not a paper, and it stays reachable from papers/,
          # README.md and the Programme Committee page.
          - section: "Archive"
            contents:
              - papers/uber-groups-rsr/index.qmd
          - papers/programme-committee/index.qmd
          - papers/proposals/index.qmd
      - section: "Surveys"
        href: surveys/index.qmd
        contents:
          - surveys/uc-for-gamers/index.qmd
          - section: "UC Encyclopedia"
            href: uc/index.qmd
            contents:
              - uc/layer-0-idealized-setup/index.qmd
              - uc/layer-1-channels-agreement-ledgers/index.qmd
              - uc/layer-2-crypto-library-symmetric/index.qmd
              - uc/layer-3-public-key-primitives/index.qmd
              - uc/layer-4-commitments-proofs/index.qmd
              - uc/layer-5-oblivious-transfer/index.qmd
              - uc/layer-6-secret-sharing-mpc/index.qmd
              - uc/layer-7-privacy-anonymity/index.qmd
              - uc/layer-8-time-application/index.qmd
      - section: "Resources"
        href: resources/index.qmd
        contents:
          - open-problems/latex-templates/index.qmd
          - prompts/index.qmd
      - section: "Blog"
        href: blog/index.qmd
        contents:
          - blog/posts/*.qmd
      - section: "About"
        href: about/index.qmd

format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    # Emits <link rel="canonical"> on every page, and with it the absolute
    # og:url. This is a format option rather than a `website:` one, but it
    # only does anything once `website: site-url:` is set above.
    canonical-url: true
    toc: true
    grid:
      sidebar-width: 260px
      body-width: 850px
