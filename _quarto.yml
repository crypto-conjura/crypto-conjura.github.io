project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"

website:
  title: "Crypto-Conjura"
  description: "An open archive of unresolved conjectures in cryptography, precise write-ups, and reusable research prompts."
  navbar:
    title: "Crypto-Conjura"
    left:
      - text: "Open Problems"
        file: open-problems/index.qmd
      - text: "Papers"
        file: papers/index.qmd
      - text: "Prompts"
        file: prompts/index.qmd
      - text: "Blog"
        file: blog/index.qmd
    right:
      - icon: github
        href: "https://github.com/crypto-conjura/crypto-conjura.github.io"

  sidebar:
    style: floating
    contents:
      - section: "Open Problems"
        href: open-problems/index.qmd
        contents:
          - section: "Lattices"
            href: open-problems/lattices/index.qmd
            contents:
              - open-problems/lattices/example-conjecture/index.qmd
          - section: "Isogenies"
            href: open-problems/isogenies/index.qmd
          - section: "Multi-Party Computation"
            href: open-problems/mpc/index.qmd
          - section: "Zero-Knowledge"
            href: open-problems/zk/index.qmd
          - section: "Symmetric-Key Cryptography"
            href: open-problems/symmetric-key/index.qmd
            contents:
              - open-problems/symmetric-key/k-collisions-auxiliary-input/index.qmd
              - open-problems/symmetric-key/feistel-6-round-indifferentiability/index.qmd
              - open-problems/symmetric-key/generalized-mirror-theory/index.qmd
      - section: "Papers"
        href: papers/index.qmd
        contents:
          - papers/example-paper/index.qmd
      - section: "Prompts"
        href: prompts/index.qmd
        contents:
          - prompts/research/index.qmd
          - prompts/proof-checking/index.qmd
          - prompts/writing/index.qmd

format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    toc: true
    grid:
      sidebar-width: 260px
      body-width: 850px
